<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="100%" height="100%">
    <!-- Nubes estilizadas estilo Friedrich (líneas curvas) -->
    <path d="M 5,14 Q 15,10 25,13 T 45,11" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.8"></path>
    <path d="M 2,19 Q 12,15 22,18 T 48,15" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.8"></path>
    <path d="M 8,24 Q 20,20 32,23 T 42,21" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.8"></path>

    <!-- Skyline minimalista de Chicago -->
    <!-- Banderolas / Antenas -->
    <line x1="10" y1="23" x2="10" y2="28" stroke="currentColor" stroke-width="0.6"></line>
    <line x1="12" y1="23" x2="12" y2="28" stroke="currentColor" stroke-width="0.6"></line>
    <line x1="39.5" y1="20" x2="39.5" y2="24" stroke="currentColor" stroke-width="0.6"></line>
    
    <!-- Siluetas de edificios -->
    <!-- Edificio izq -->
    <rect x="4" y="32" width="4" height="10" fill="currentColor"></rect>
    <!-- Willis Tower (Sears) -->
    <rect x="9" y="28" width="4" height="14" fill="currentColor"></rect>
    <!-- Edificio centro-izq -->
    <rect x="14" y="30" width="5" height="12" fill="currentColor"></rect>
    <!-- Edificio centro -->
    <rect x="20" y="27" width="6" height="15" fill="currentColor"></rect>
    <!-- Edificio centro-der -->
    <rect x="27" y="31" width="5" height="11" fill="currentColor"></rect>
    <!-- Edificio alto der -->
    <rect x="33" y="26" width="4" height="16" fill="currentColor"></rect>
    <!-- 875 North Michigan (John Hancock Center - Trapezoidal) -->
    <polygon points="38,42 39,24 41,24 42,42" fill="currentColor"></polygon>
    <!-- Edificio der extremo -->
    <rect x="43" y="33" width="4" height="9" fill="currentColor"></rect>

    <!-- Línea horizontal (Horizonte / Suelo) -->
    <line x1="0" y1="42" x2="50" y2="42" stroke="currentColor" stroke-width="1.2"></line>

    <!-- Figura humana de espaldas en primer plano -->
    <!-- Cabeza -->
    <circle cx="25" cy="38" r="1.2" fill="currentColor"></circle>
    <!-- Cuerpo / Espalda -->
    <path d="M 23.5,42 L 24.2,39.5 C 24.3,39.2 24.6,39 25,39 C 25.4,39 25.7,39.2 25.8,39.5 L 26.5,42 Z" fill="currentColor"></path>
</svg>